name: Bug report
description: Report a reproducible defect in code or documentation.
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a problem. Please remove secrets
        and private data from commands, logs, and checkpoints before posting.
  - type: textarea
    id: summary
    attributes:
      label: What happened?
      description: Describe the observed behavior and why it is a problem.
      placeholder: A concise description of the failure.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Minimal reproduction
      description: Include a minimal command, script, or test case.
      render: shell
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: State what should have happened.
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual output
      description: Paste the relevant error or output. Replace secrets with [REDACTED_SECRET].
      render: text
    validations:
      required: true
  - type: input
    id: commit
    attributes:
      label: Commit or version
      placeholder: Exact commit or package version.
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Include OS, Python, PyTorch, CUDA/Triton/driver, GPU/CPU, and relevant package versions.
      placeholder: |
        OS:
        Python:
        PyTorch:
        CUDA/Triton/driver:
        Device:
    validations:
      required: true
  - type: checkboxes
    id: checks
    attributes:
      label: Checks
      options:
        - label: I searched existing issues and removed secrets/private data.
          required: true
