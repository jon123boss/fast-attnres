name: Release to PyPI

on:
  push:
    tags:
      - "v*"

# Build jobs do not receive a write-capable token. The release and PyPI jobs
# declare their additional permissions at job scope below.
permissions:
  contents: read

concurrency:
  group: fast-attnres-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build release assets
    # A v* tag must be protected before it can enter the release pipeline.
    if: >-
      startsWith(github.ref, 'refs/tags/v') && github.ref_protected == true
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
          cache: pip
      - name: Install release tooling
        run: |
          python -m pip install --upgrade pip
          python -m pip install "setuptools>=68" wheel "build>=1" "twine>=5" "numpy>=1.24,<3"
      - name: Check tag matches project version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python - <<'PY'
          import os
          import tomllib
          from pathlib import Path

          project = tomllib.loads(Path("pyproject.toml").read_text(encoding="utf-8"))["project"]
          expected = f"v{project['version']}"
          actual = os.environ["RELEASE_TAG"]
          if actual != expected:
              raise SystemExit(f"release tag {actual!r} does not match {expected!r}")
          if project["name"] != "fast-attnres":
              raise SystemExit(f"unexpected project name: {project['name']!r}")
          PY
      - name: Verify frozen release contract
        run: |
          python - <<'PY'
          import hashlib
          import json
          from pathlib import Path

          root = Path.cwd()
          manifest = json.loads((root / "validation/frozen.json").read_text(encoding="utf-8"))
          mismatches = []
          for name, expected in manifest.items():
              path = root / name
              if not path.is_file():
                  mismatches.append(f"{name}: missing")
                  continue
              actual = hashlib.sha256(path.read_bytes()).hexdigest()
              if actual != expected:
                  mismatches.append(f"{name}: expected {expected}, got {actual}")
          if mismatches:
              raise SystemExit("frozen release contract mismatch:\n" + "\n".join(mismatches))
          print(f"verified {len(manifest)} frozen files")
          PY
      - name: Audit current shipped-kernel performance evidence
        env:
          PYTHONDONTWRITEBYTECODE: "1"
          PYTHONPATH: src:.
        run: |
          python benchmarks/audit_current_24l.py \
            --evidence-dir results/current_24l \
            --repo . \
            --output "${RUNNER_TEMP}/current-24l-audit.json"
      - name: Reconstruct exact compiled-step performance source checkout
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          set -euo pipefail
          performance_commit="$(python - <<'PY'
          import json
          import re
          from pathlib import Path

          manifest = json.loads(
              (Path("results") / "compiled_step" / "campaign_manifest.json").read_text(encoding="utf-8")
          )
          revision = manifest.get("repo_head") or manifest.get("repo_base_revision")
          if not isinstance(revision, str) or re.fullmatch(r"[0-9a-f]{40}", revision) is None:
              raise SystemExit(f"invalid compiled-step performance source revision: {revision!r}")
          print(revision)
          PY
          )"
          bundle="validation/performance_sources/compiled-step-${performance_commit}.bundle"
          test -f "$bundle"
          echo "09547604f0a9630ed8769cf55479f255754dce2431d325ddcf250af8bafdde17  $bundle" | sha256sum -c -
          git bundle verify "$bundle"
          performance_source="${RUNNER_TEMP}/fast-attnres-performance-source"
          git clone --no-local "$bundle" "$performance_source"
          actual_commit="$(git -C "$performance_source" rev-parse HEAD)"
          test "$actual_commit" = "$performance_commit"
          test -z "$(git -C "$performance_source" status --porcelain --untracked-files=all)"
          echo "PERFORMANCE_SOURCE_DIR=$performance_source" >> "$GITHUB_ENV"
          echo "auditing compiled-step evidence against $performance_commit"
      - name: Build deterministic release assets
        env:
          PYTHONDONTWRITEBYTECODE: "1"
          PYTHONPATH: src:.
        run: |
          set -euo pipefail
          release_dir="${RUNNER_TEMP}/fast-attnres-release"
          mkdir -p "$release_dir"
          epoch="$(git show -s --format=%ct "$GITHUB_SHA")"
          SOURCE_DATE_EPOCH="$epoch" python scripts/build_release.py \
            --output-dir "$release_dir" \
            --evidence-dir results/compiled_step \
            --campaign-manifest results/compiled_step/campaign_manifest.json \
            --performance-source "$PERFORMANCE_SOURCE_DIR"
          RELEASE_DIR="$release_dir" python - <<'PY'
          import hashlib
          import os
          from pathlib import Path
          import re
          import tomllib

          release_dir = Path(os.environ["RELEASE_DIR"])
          project = tomllib.loads(Path("pyproject.toml").read_text(encoding="utf-8"))["project"]
          name = project["name"]
          version = project["version"]
          normalized_name = re.sub(r"[-_.]+", "_", name)
          files = sorted(path for path in release_dir.iterdir() if path.is_file())
          wheel = [path for path in files if path.suffix == ".whl"]
          sdist = [path for path in files if path.name == f"{normalized_name}-{version}.tar.gz"]
          evidence = release_dir / f"{name}-{version}-evidence.tar.gz"
          checksums = release_dir / "SHA256SUMS"
          if len(wheel) != 1:
              raise SystemExit(f"expected one wheel, found {[path.name for path in wheel]}")
          if len(sdist) != 1 or not evidence.is_file() or not checksums.is_file():
              raise SystemExit("release asset set is incomplete")
          expected_names = {wheel[0].name, sdist[0].name, evidence.name, checksums.name}
          actual_names = {path.name for path in files}
          if actual_names != expected_names:
              raise SystemExit(
                  f"release directory must contain exactly {sorted(expected_names)!r}; "
                  f"found {sorted(actual_names)!r}"
              )
          expected_checksums = "".join(
              f"{hashlib.sha256(path.read_bytes()).hexdigest()}  {path.name}\n"
              for path in sorted((wheel[0], sdist[0], evidence), key=lambda item: item.name)
          )
          if checksums.read_text(encoding="ascii") != expected_checksums:
              raise SystemExit("SHA256SUMS does not describe the three release payloads")
          print("verified release assets:", ", ".join(sorted(actual_names)))
          PY
          (cd "$release_dir" && sha256sum -c SHA256SUMS)
          RELEASE_DIR="$release_dir" python - <<'PY'
          import os
          import tarfile
          from pathlib import Path

          evidence = next(Path(os.environ["RELEASE_DIR"]).glob("*-evidence.tar.gz"))
          with tarfile.open(evidence, mode="r:gz") as archive:
              names = {member.name for member in archive.getmembers()}
          required_files = {"results/compiled_step/campaign_manifest.json"}
          required_prefixes = {
              "results/compiled_step/raw/",
              "results/compiled_step/audits/",
              "results/compiled_step/attestations/",
          }
          missing = sorted(
              (required_files - names)
              | {prefix for prefix in required_prefixes if not any(name.startswith(prefix) for name in names)}
          )
          if missing:
              raise SystemExit(f"compiled-step evidence archive is incomplete: missing {missing}")
          if any(name.startswith("results/") and not name.startswith("results/compiled_step") for name in names):
              raise SystemExit("non compiled-step timing evidence entered the release archive")
          print("verified compiled-step evidence archive")
          PY
          # Twine must inspect only the two installable distributions. The
          # evidence archive deliberately also ends in .tar.gz.
          pypi_dir="${RUNNER_TEMP}/fast-attnres-pypi"
          RELEASE_DIR="$release_dir" PYPI_DIR="$pypi_dir" python - <<'PY'
          import os
          from pathlib import Path
          import shutil

          release_dir = Path(os.environ["RELEASE_DIR"])
          pypi_dir = Path(os.environ["PYPI_DIR"])
          wheel = sorted(release_dir.glob("*.whl"))
          sdist = sorted(
              path for path in release_dir.glob("*.tar.gz") if not path.name.endswith("-evidence.tar.gz")
          )
          if len(wheel) != 1 or len(sdist) != 1:
              raise SystemExit("expected one wheel and one source distribution")
          pypi_dir.mkdir(parents=True, exist_ok=True)
          for path in (wheel[0], sdist[0]):
              shutil.copy2(path, pypi_dir / path.name)
          PY
          python -m twine check "$pypi_dir"/*
      - name: Upload complete release asset set
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: fast-attnres-release-assets
          path: ${{ runner.temp }}/fast-attnres-release/*
          if-no-files-found: error
          retention-days: 7

  attest:
    name: Attest release assets
    needs: build
    if: >-
      needs.build.result == 'success' &&
      startsWith(github.ref, 'refs/tags/v') && github.ref_protected == true
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      attestations: write
      id-token: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: fast-attnres-release-assets
          path: ${{ runner.temp }}/fast-attnres-release
      - name: Verify downloaded assets and checksums
        env:
          RELEASE_DIR: ${{ runner.temp }}/fast-attnres-release
        run: |
          set -euo pipefail
          test "$(find "$RELEASE_DIR" -maxdepth 1 -type f | wc -l)" -eq 4
          (cd "$RELEASE_DIR" && sha256sum -c SHA256SUMS)
      - name: Attest every release asset
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: ${{ runner.temp }}/fast-attnres-release/*

  github-release:
    name: Create GitHub release assets
    needs: [build, attest]
    if: >-
      needs.build.result == 'success' &&
      needs.attest.result == 'success' &&
      startsWith(github.ref, 'refs/tags/v') && github.ref_protected == true
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: fast-attnres-release-assets
          path: ${{ runner.temp }}/fast-attnres-release
      - name: Verify release checksums before upload
        env:
          RELEASE_DIR: ${{ runner.temp }}/fast-attnres-release
        run: cd "$RELEASE_DIR" && sha256sum -c SHA256SUMS
      - name: Create GitHub release and upload all documented assets
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8.0.0
        env:
          RELEASE_DIR: ${{ runner.temp }}/fast-attnres-release
          RELEASE_TAG: ${{ github.ref_name }}
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require("fs");
            const path = require("path");

            const directory = process.env.RELEASE_DIR;
            const files = fs.readdirSync(directory, { withFileTypes: true })
              .filter((entry) => entry.isFile())
              .map((entry) => path.join(directory, entry.name))
              .sort();
            if (files.length !== 4) {
              throw new Error(`expected four release assets, found ${files.length}`);
            }

            const { owner, repo } = context.repo;
            const tag = process.env.RELEASE_TAG;
            let release;
            try {
              release = (await github.rest.repos.getReleaseByTag({ owner, repo, tag })).data;
            } catch (error) {
              if (error.status !== 404) throw error;
              release = (await github.rest.repos.createRelease({
                owner,
                repo,
                tag_name: tag,
                name: tag,
                generate_release_notes: true,
                draft: false,
                prerelease: false,
              })).data;
            }

            for (const file of files) {
              const name = path.basename(file);
              const existing = await github.paginate(github.rest.repos.listReleaseAssets, {
                owner,
                repo,
                release_id: release.id,
                per_page: 100,
              });
              for (const asset of existing.filter((item) => item.name === name)) {
                await github.rest.repos.deleteReleaseAsset({
                  owner,
                  repo,
                  asset_id: asset.id,
                });
              }
              const data = fs.readFileSync(file);
              await github.rest.repos.uploadReleaseAsset({
                owner,
                repo,
                release_id: release.id,
                name,
                label: name,
                data,
                headers: {
                  "content-type": "application/octet-stream",
                  "content-length": data.length,
                },
              });
            }
            core.notice(`uploaded ${files.length} assets to ${tag}`);

  publish:
    name: Publish wheel and sdist to PyPI
    needs: [build, attest]
    if: >-
      needs.build.result == 'success' &&
      needs.attest.result == 'success' &&
      startsWith(github.ref, 'refs/tags/v') && github.ref_protected == true
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: pypi
      url: https://pypi.org/project/fast-attnres/
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: fast-attnres-release-assets
          path: ${{ runner.temp }}/fast-attnres-release
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - name: Verify checksums and isolate PyPI distributions
        env:
          RELEASE_DIR: ${{ runner.temp }}/fast-attnres-release
          PYPI_DIR: ${{ runner.temp }}/fast-attnres-pypi
        run: |
          set -euo pipefail
          (cd "$RELEASE_DIR" && sha256sum -c SHA256SUMS)
          RELEASE_DIR="$RELEASE_DIR" PYPI_DIR="$PYPI_DIR" python - <<'PY'
          import os
          from pathlib import Path
          import shutil

          release_dir = Path(os.environ["RELEASE_DIR"])
          pypi_dir = Path(os.environ["PYPI_DIR"])
          wheels = sorted(release_dir.glob("*.whl"))
          sdists = sorted(
              path for path in release_dir.glob("*.tar.gz") if not path.name.endswith("-evidence.tar.gz")
          )
          if len(wheels) != 1 or len(sdists) != 1:
              raise SystemExit("expected exactly one wheel and one source distribution")
          pypi_dir.mkdir(parents=True, exist_ok=True)
          for path in (wheels[0], sdists[0]):
              shutil.copy2(path, pypi_dir / path.name)
          PY
      - name: Check PyPI metadata
        env:
          PYPI_DIR: ${{ runner.temp }}/fast-attnres-pypi
        run: |
          python -m pip install --upgrade pip "twine>=5"
          python -m twine check "$PYPI_DIR"/*
      - name: Publish only wheel and source distribution with PyPI Trusted Publishing
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          packages-dir: ${{ runner.temp }}/fast-attnres-pypi/
          skip-existing: true
          print-hash: true
